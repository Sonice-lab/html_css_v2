<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Landing Page</title>
    <style>
      /* 초기화 및 기본 폰트 설정 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        background-color: #f8f9fa;
      }

      /* 상단 스타일 */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 60px;
        background-color: #ffffff;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 800;
      }

      .logo .brand {
        color: #1a237e;
      }

      .logo .logo-text {
        color: #00bcd4;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 30px;
      }

      nav ul li a {
        text-decoration: none;
        color: #333333;
        font-weight: 600;
        font-size: 1rem;
      }

      /* 중앙(Hero)스타일 */
      .hero {
        background-color: #3949ab;
        color: #ffffff;
        text-align: center;
        padding: 100px 20px;
      }

      .hero h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: 700;
      }

      .hero p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      /* 하단(Features) 스타일 */
      .features {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 60px;
        background-color: #f8f9fa;
      }

      .card {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 50px 30px;
        text-align: center;
        flex: 1;
        max-width: 320px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      .card .icon {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      .card h3 {
        color: #1a237e;
        font-size: 1.2rem;
        margin-bottom: 15px;
        font-weight: 700;
      }

      .card p {
        color: #666666;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      /* 푸터 스타일 */
      footer {
        background-color: #424242;
        color: #ffffff;
        text-align: center;
        padding: 25px 20px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <!-- 상단 Header -->
    <header>
      <div class="logo">
        <span class="brand">BRAND</span>
        <span class="logo-text">LOGO</span>
      </div>
      <nav>
        <ul>
          <li><a href="#">소개</a></li>
          <li><a href="#">서비스</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </header>

    <!-- 중앙 Hero Section -->
    <section class="hero">
      <h1>더 나은 미래를 만드는 혁신</h1>
      <p>우리는 가장 단순한 방법으로 최고의 가치를 전달합니다.</p>
    </section>

    <!-- 하단 Features Section -->
    <section class="features">
      <!-- 첫번째 카드 -->
      <div class="card">
        <div class="icon">🚀</div>
        <h3>빠른 속도</h3>
        <p>최신 기술을 활용하여 가장 빠른 퍼포먼스를 보장합니다.</p>
      </div>

      <!-- 두번째 카드 -->
      <div class="card">
        <div class="icon">💎</div>
        <h3>높은 품질</h3>
        <p>정교한 코드와 디자인으로 최상의 결과물을 제공합니다.</p>
      </div>

      <!-- 세번째 카드 -->
      <div class="card">
        <div class="icon">🤝</div>
        <h3>고객 신뢰</h3>
        <p>언제나 고객의 목소리에 귀 기울이며 함께 성장합니다.</p>
      </div>
    </section>

    <!-- footer -->
    <footer>
      <p>&copy; 2026 Brand Design. All rights reserved</p>
    </footer>
  </body>
</html>
