<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Practice]명상의 숲</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>모여봐요, 명상의 숲!</h1>
      <p>당신의 뇌를 깨우는 명상시간</p>
      <button class="btn-start">명상 시작하기</button>
    </header>
    <main>
      <div class="meditation-course-grid">
        <!-- course 1 -->
        <div class="course">
          <img src="https://picsum.photos/id/9/300/200" alt="명상 이미지" />
          <div class="card-body">
            <h3 class="course-name">물의 명상</h3>
            <p class="course-desc">물을 활용한 명상</p>
            <span class="price">4주 코스 200,000원</span>
          </div>
        </div>

        <!-- course 2 -->
        <div class="course">
          <img src="https://picsum.photos/id/10/300/200" alt="명상 이미지" />
          <div class="card-body">
            <h3 class="course-name">불의 명상</h3>
            <p class="course-desc">불을 활용한 명상</p>
            <span class="price">4주 코스 400,000원</span>
          </div>
        </div>

        <!-- course 3 -->
        <div class="course">
          <img src="https://picsum.photos/id/11/300/200" alt="명상 이미지" />
          <div class="card-body">
            <h3 class="course-name">바람의 명상</h3>
            <p class="course-desc">바람을 활용한 명상</p>
            <span class="price">4주 코스 500,000원</span>
          </div>
        </div>
        <!--card end-->
      </div>
    </main>
  </body>
</html>
